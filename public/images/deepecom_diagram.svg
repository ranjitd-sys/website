<svg viewBox="0 0 805 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#5B4FE0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6C5CE7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer card -->
  <rect x="20" y="20" width="765" height="500" rx="24" fill="#FFFFFF" filter="url(#softShadow)"/>

  <!-- Labels -->
  <text x="120" y="80" font-size="13" font-weight="700" letter-spacing="2" fill="#B0AFC0">BEFORE</text>
  <text x="595" y="80" font-size="13" font-weight="700" letter-spacing="2" fill="#22B07A">AFTER</text>

  <!-- Connector convergence points -->
  <!-- Left convergence point (on left edge of center box, vertical middle) -->
  <!-- Center box: x=300, width=205, y=110, height=280 -->
  <!-- left point: (300, 250), right point: (505, 250) -->

  <!-- BEFORE boxes: left edge x=80, width=180, right edge x=260 -->
  <!-- centered vertically at y = 138, 204, 270, 336, 402 (box height 44) -->

  <!-- Dashed connector lines: from right edge of each before-box to left convergence point -->
  <g stroke="#B7ABEF" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
    <path d="M 260 138 C 280 138, 280 250, 300 250"/>
    <path d="M 260 204 C 280 204, 280 250, 300 250"/>
    <path d="M 260 270 C 285 270, 285 250, 300 250"/>
    <path d="M 260 336 C 280 336, 280 250, 300 250"/>
    <path d="M 260 402 C 280 402, 280 250, 300 250"/>
  </g>

  <!-- Left convergence dot -->
  <circle cx="300" cy="250" r="5" fill="#7C6EF0"/>

  <!-- BEFORE cards -->
  <g font-size="15" font-weight="600" fill="#2F2B45">
    <rect x="80" y="116" width="180" height="44" rx="12" fill="#FFFFFF" stroke="#ECEAF7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="102" y="143">Marketplaces</text>

    <rect x="80" y="182" width="180" height="44" rx="12" fill="#FFFFFF" stroke="#ECEAF7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="102" y="209">Payments</text>

    <rect x="80" y="248" width="180" height="44" rx="12" fill="#FFFFFF" stroke="#ECEAF7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="102" y="275">Fees &amp; Charges</text>

    <rect x="80" y="314" width="180" height="44" rx="12" fill="#FFFFFF" stroke="#ECEAF7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="102" y="341">Returns</text>

    <rect x="80" y="380" width="180" height="44" rx="12" fill="#FFFFFF" stroke="#ECEAF7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="102" y="407">Inventory</text>
  </g>

  <!-- Right convergence dot -->
  <circle cx="505" cy="250" r="5" fill="#7C6EF0"/>

  <!-- Dashed connector lines: from right convergence point to left edge of each after-box -->
  <!-- AFTER boxes: left edge x=545, width=180 -->
  <!-- centered vertically at y = 155, 221, 287, 353 (4 boxes) -->
  <g stroke="#B7ABEF" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
    <path d="M 505 250 C 520 250, 520 155, 545 155"/>
    <path d="M 505 250 C 520 250, 520 221, 545 221"/>
    <path d="M 505 250 C 520 250, 520 287, 545 287"/>
    <path d="M 505 250 C 520 250, 520 353, 545 353"/>
  </g>

  <!-- Center panel -->
  <rect x="300" y="110" width="205" height="280" rx="20" fill="url(#centerGrad)" filter="url(#cardShadow)"/>
  <text x="402" y="150" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="1" fill="#FFFFFF">DEEPECOM</text>

  <rect x="320" y="180" width="165" height="34" rx="8" fill="#8477EE"/>
  <text x="402" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Understand</text>

  <rect x="320" y="224" width="165" height="34" rx="8" fill="#8477EE"/>
  <text x="402" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Reconcile</text>

  <rect x="320" y="268" width="165" height="34" rx="8" fill="#8477EE"/>
  <text x="402" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Account</text>

  <text x="402" y="345" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DAD5FB">One financial layer</text>

  <!-- AFTER cards -->
  <g font-size="15" font-weight="600" fill="#1E5F45">
    <rect x="545" y="133" width="180" height="44" rx="12" fill="#EAFBF2" stroke="#CFF3DF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="571" cy="155" r="10" fill="#22B07A"/>
    <path d="M 566 155 L 570 159 L 577 150" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="590" y="160">Profitability</text>

    <rect x="545" y="199" width="180" height="44" rx="12" fill="#EAFBF2" stroke="#CFF3DF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="571" cy="221" r="10" fill="#22B07A"/>
    <path d="M 566 221 L 570 225 L 577 216" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="590" y="226">Reconciliation</text>

    <rect x="545" y="265" width="180" height="44" rx="12" fill="#EAFBF2" stroke="#CFF3DF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="571" cy="287" r="10" fill="#22B07A"/>
    <path d="M 566 287 L 570 291 L 577 282" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="590" y="292">Reports</text>

    <rect x="545" y="331" width="180" height="44" rx="12" fill="#EAFBF2" stroke="#CFF3DF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="571" cy="353" r="10" fill="#22B07A"/>
    <path d="M 566 353 L 570 357 L 577 348" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="590" y="358">ERP Accounting</text>
  </g>
</svg>
