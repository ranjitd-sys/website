name: DeepRank Weekly Optimize

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deeprank-optimize
  cancel-in-progress: false

env:
  SEO_DATABASE_URL: ${{ secrets.SEO_DATABASE_URL }}
  GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
  GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
  GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.DEEPRANK_GITHUB_TOKEN || github.token }}
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: seo-agent
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: seo-agent
        run: bun run check

      - name: Run optimize
        working-directory: seo-agent
        run: bun run src/cli.ts optimize

      - name: Summarize
        if: always()
        run: echo "DeepRank weekly optimize finished. See run logs for the opened PR (if any)."